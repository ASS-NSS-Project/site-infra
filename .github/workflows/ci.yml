name: CI

on:
  push:
    branches: [kost] #[kost, main]
  # pull_request:
  #   branches: [main]

jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pre-commit conventional-pre-commit
      - name: Check commit message
        run: |
          MSG_FILE=$(mktemp)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git log -1 --format=%B ${{ github.event.pull_request.head.sha }} > "$MSG_FILE"
          else
            git log -1 --format=%B > "$MSG_FILE"
          fi
          pre-commit run -c .github/config/pre-commit-config.yaml --hook-stage commit-msg --commit-msg-filename "$MSG_FILE"

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g markdownlint-cli
      - run: markdownlint --config .github/config/markdownlint.yaml "**/*.md" --ignore-path .gitignore

  terraform-fmt:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11"
      - name: Check formatting in all modules
        run: |
          terraform fmt -check -recursive terraform/

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [infra, vault, keycloak]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11"
      - uses: actions/cache@v4
        with:
          path: terraform/${{ matrix.module }}/.terraform
          key: terraform-${{ matrix.module }}-${{ hashFiles(format('terraform/{0}/.terraform.lock.hcl', matrix.module)) }}
      - name: Validate ${{ matrix.module }}
        # -backend=false skips GCS/provider auth — only checks syntax and references
        run: |
          terraform -chdir=terraform/${{ matrix.module }} init -backend=false
          terraform -chdir=terraform/${{ matrix.module }} validate

  tfsec:
    name: Terraform security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ansible-lint
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: ansible-lint ansible/site.yml

  tfvars-example-sync:
    name: Terraform tfvars example sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-tfvars-example.sh

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install yamllint
      - run: yamllint -c .github/config/yamllint.yaml .

  kubeconform:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        # --ignore-missing-schemas skips CRDs (ArgoCD, cert-manager, ESO, etc.)
        # Standard K8s resources are still validated against the upstream schemas
        run: |
          find argocd/apps -name "*.yaml" ! -name "*-Application.yaml" ! -name "kustomization.yaml" ! -path "*/helm/*" \
            | xargs kubeconform \
              --ignore-missing-schemas \
              --kubernetes-version 1.31.0 \
              --summary

  kube-score:
    name: Kubernetes best practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kube-score
        run: |
          curl -sSLo kube-score.tar.gz \
            https://github.com/zegl/kube-score/releases/latest/download/kube-score_linux_amd64.tar.gz
          tar -xf kube-score.tar.gz
          sudo mv kube-score /usr/local/bin/
      - name: Score manifests
        # Only scores standard K8s resources — CRDs are skipped automatically
        # Warnings (yellow) do not fail the build, only criticals (red) do
        run: |
          find argocd/apps -name "*.yaml" ! -name "*-Application.yaml" ! -name "kustomization.yaml" ! -path "*/helm/*" \
            | xargs kube-score score --output-format ci
