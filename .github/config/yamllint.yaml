extends: default

rules:
  # 120 chars is reasonable for infrastructure YAML with long strings
  line-length:
    max: 120
    level: warning

  # Neither require nor forbid --- (Ansible uses it, Kubernetes often doesn't)
  document-start: disable

  # Allow both yes/no (Ansible) and true/false (Kubernetes)
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false

  # Inline comments are fine
  comments-indentation: disable

ignore: |
  .venv/
  .terraform/
