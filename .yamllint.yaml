extends: default

rules:
  # 120 chars is reasonable for infrastructure YAML with long strings
  line-length:
    max: 120
    level: warning

  # Ansible and Kubernetes both use multi-document files occasionally
  document-start:
    present: false

  # Allow both yes/no (Ansible) and true/false (Kubernetes)
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false

  # Inline comments are fine
  comments-indentation: disable

ignore: |
  .venv/
  .terraform/
