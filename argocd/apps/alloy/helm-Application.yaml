# Wave 16 — Grafana Alloy log collector (after auth stack, before Loki wave 17)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  revisionHistoryLimit: 0
  project: observability
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: ">=0.1.0"
      helm:
        releaseName: alloy
        valueFiles:
          - $values/argocd/apps/alloy/helm/values.yaml
    - repoURL: https://github.com/ASS-NSS-Project/site-infra
      targetRevision: kost
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: alloy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
