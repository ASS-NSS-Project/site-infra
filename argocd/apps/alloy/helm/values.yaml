# Alloy runs as a single Deployment and streams pod/container logs via the
# Kubernetes API (loki.source.kubernetes) — no host filesystem mounts needed.

controller:
  type: deployment
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

alloy:
  configMap:
    content: |
      // Discover all pods in the cluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Relabel pod metadata into Loki stream labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // Use app.kubernetes.io/name when set, fall back to the app label
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "app"
        }
      }

      // Stream logs from each container via the Kubernetes API
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.rag_labels.receiver]
      }

      // Tag rag-system structured logs with a rag_app label for Loki queries:
      //   rag_app=audit      → login / user / query / admin-action / security events
      //   rag_app=incident   → CAPTCHA detection and resolution events
      //   rag_app=pipeline   → ingest / embedding / search / model events
      loki.process "rag_labels" {
        forward_to = [loki.write.default.receiver]

        // Security, user-lifecycle, query, and admin-action events
        stage.match {
          selector = `{namespace="rag-system"} |~ "\"event\":\\s*\"(login_success|login_failed|user_registered|user_updated|query_received|query_completed|query_failed|jwt_invalid|http_error|http_request_start|keycloak_unauthorized|keycloak_connect_error|source_created|source_updated|source_deleted|ingest_triggered|job_cancelled|job_deleted|admin_created|presigned_url_failed)\""`
          stage.static_labels {
            values = { rag_app = "audit" }
          }
        }

        // CAPTCHA detection and manual incident lifecycle
        stage.match {
          selector = `{namespace="rag-system"} |~ "\"event\":\\s*\"(captcha_detected|incident_simulated|incident_resolved)\""`
          stage.static_labels {
            values = { rag_app = "incident" }
          }
        }

        // Ingest pipeline, embedding, vector search, and model events
        stage.match {
          selector = `{namespace="rag-system"} |~ "\"event\":\\s*\"(ingest_started|ingest_completed|ingest_failed|embedding_completed|embedding_failed|search_start|search_complete|search_failed|model_load_start|model_load_complete|chunks_delete|source_seeded)\""`
          stage.static_labels {
            values = { rag_app = "pipeline" }
          }
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
