# Alloy runs as a single Deployment and streams pod/container logs via the
# Kubernetes API (loki.source.kubernetes) — no host filesystem mounts needed.

controller:
  type: deployment
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

alloy:
  configMap:
    content: |
      // Discover all pods in the cluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Relabel pod metadata into Loki stream labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // Use app.kubernetes.io/name when set, fall back to the app label
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "app"
        }
      }

      // Stream logs from each container via the Kubernetes API
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.rag_labels.receiver]
      }

      // Tag rag-system structured logs with a rag_app label for Loki queries:
      //   rag_app=audit    → login / user-management events
      //   rag_app=incident → CAPTCHA detection events
      //   rag_app=pipeline → ingest / embedding / search events
      loki.process "rag_labels" {
        forward_to = [loki.write.default.receiver]

        stage.match {
          selector = `{namespace="rag-system"} |~ "\"event\":\\s*\"(login_success|login_failed|user_registered|keycloak_role_synced|keycloak_sync_failed)\""`
          stage.static_labels {
            values = { rag_app = "audit" }
          }
        }

        stage.match {
          selector = `{namespace="rag-system"} |~ "\"event\":\\s*\"captcha_detected\""`
          stage.static_labels {
            values = { rag_app = "incident" }
          }
        }

        stage.match {
          selector = `{namespace="rag-system"} |~ "\"event\":\\s*\"(ingest_started|ingest_completed|ingest_failed|embedding_completed|embedding_failed|search_start|search_complete|search_failed)\""`
          stage.static_labels {
            values = { rag_app = "pipeline" }
          }
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
