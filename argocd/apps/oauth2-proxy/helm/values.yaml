# oauth2-proxy — ForwardAuth provider for Traefik
# Protects apps without native OIDC (Longhorn, Prometheus, Alertmanager)
# Secrets are injected via environment variables from ESO-synced K8s secrets.

config:
  # clientID, clientSecret and cookieSecret are all provided via existingSecret
  existingSecret: oauth2-proxy-credentials

extraArgs:
  provider: keycloak-oidc
  oidc-issuer-url: https://keycloak.ass-nss.jkuzel02.online/realms/ass-nss
  email-domain: "*"
  upstream: static://200
  cookie-secure: "true"
  cookie-domain: ".ass-nss.jkuzel02.online"
  whitelist-domain: ".ass-nss.jkuzel02.online"
  skip-provider-button: "true"
  silence-ping-logging: "true"
  # groups is a protocol mapper claim, not a Keycloak scope — request only standard scopes
  scope: "openid email profile"
  # Only members of the admin Keycloak group can access oauth2-proxy-protected apps
  allowed-group: admin
