# Wave 1 — oauth2-proxy (ForwardAuth for apps without native OIDC)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  sources:
    - repoURL: https://oauth2-proxy.github.io/manifests
      chart: oauth2-proxy
      targetRevision: ">=7.0.0"
      helm:
        releaseName: oauth2-proxy
        valueFiles:
          - $values/argocd/apps/oauth2-proxy/helm/values.yaml
    - repoURL: https://github.com/ASS-NSS-Project/site-infra
      targetRevision: kost
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: oauth2-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
