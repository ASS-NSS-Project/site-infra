# Wave 2 — oauth2-proxy config (credentials secret via ESO + Traefik middleware)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ASS-NSS-Project/site-infra
    targetRevision: kost
    path: argocd/apps/oauth2-proxy/config
  destination:
    server: https://kubernetes.default.svc
    namespace: oauth2-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
