# Wave 20 — Qdrant vector DB (deploys into rag-system namespace ahead of app wave 21)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  revisionHistoryLimit: 0
  project: infrastructure
  source:
    repoURL: https://qdrant.github.io/qdrant-helm
    chart: qdrant
    targetRevision: ">=0.1.0"
    helm:
      releaseName: qdrant
      values: |
        replicaCount: 1
        image:
          repository: docker.io/qdrant/qdrant
          tag: "v1.13.6"
        persistence:
          accessModes: ["ReadWriteOnce"]
          storageClassName: longhorn
          size: 10Gi
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        livenessProbe:
          enabled: true
          initialDelaySeconds: 30
        readinessProbe:
          enabled: true
          initialDelaySeconds: 10
  destination:
    server: https://kubernetes.default.svc
    namespace: qdrant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
