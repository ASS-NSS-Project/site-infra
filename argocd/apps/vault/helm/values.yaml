# HashiCorp Vault
# TLS is terminated at Traefik — Vault listens on plain HTTP internally.
# Standalone mode — single pod with file storage on Longhorn.
# Auto-unseal via GCP KMS — no manual unseal needed after pod restarts.
#
# First-time init (once only, after first deployment):
#   kubectl exec -n vault vault-helm-0 -- vault operator init
# Save the recovery keys and root token — unseal is automatic from this point.

ui:
  enabled: true
  serviceType: ClusterIP
  externalPort: 8200

server:
  ha:
    enabled: false

  extraEnvironmentVars:
    GOOGLE_APPLICATION_CREDENTIALS: /vault/kms/credentials.json

  volumes:
    - name: kms-creds
      secret:
        secretName: vault-kms-sa

  volumeMounts:
    - name: kms-creds
      mountPath: /vault/kms
      readOnly: true

  standalone:
    config: |
      ui = true

      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

      seal "gcpckms" {
        project    = "enc-ass-nss-project"
        region     = "global"
        key_ring   = "vault-keyring"
        crypto_key = "vault-unseal-key"
      }

  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce

# Vault Agent Injector — disable unless injecting secrets into pods
injector:
  enabled: false
