# Wave 6 — HashiCorp Vault (Helm chart + values from git)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  revisionHistoryLimit: 0
  project: infrastructure
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: ">=0.28.0"
      helm:
        valueFiles:
          - $values/argocd/apps/vault/helm/values.yaml
    - repoURL: https://github.com/ASS-NSS-Project/enc-ass-nss-project
      targetRevision: kost
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
