# HTTP → HTTPS redirect for all hostnames.
# cert-manager's ACME challenge HTTPRoutes use a more specific path match
# (/.well-known/acme-challenge/*) so they take priority over this redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: traefik
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - nss.jkzl.eu
    - argocd.nss.jkzl.eu
    - longhorn.nss.jkzl.eu
    - vault.nss.jkzl.eu
    - keycloak.nss.jkzl.eu
    - grafana.nss.jkzl.eu
    - prometheus.nss.jkzl.eu
    - alertmanager.nss.jkzl.eu
    - rabbitmq.nss.jkzl.eu
    - qdrant.nss.jkzl.eu
    - webrag.nss.jkzl.eu
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
