# Single Gateway for the entire cluster.
# HTTP listener is open to all namespaces so cert-manager can attach
# HTTPRoutes for HTTP-01 ACME challenges.
#
# TLS termination: one HTTPS listener per hostname (HTTP-01 limitation —
# wildcard certs require DNS-01).
#
# To add a new subdomain (e.g. website.nss.jkzl.eu):
#   1. Add a new listener block below (copy the websecure-root example)
#   2. Add a Certificate resource in argocd/apps/cert-manager/config/
#   3. ArgoCD will sync both, cert-manager handles the rest
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
    # HTTP — ACME HTTP-01 challenges + redirect to HTTPS
    - name: web
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS — root domain
    - name: websecure-root
      port: 443
      protocol: HTTPS
      hostname: nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-root-tls
            namespace: traefik

    - name: websecure-argocd
      port: 443
      protocol: HTTPS
      hostname: argocd.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-argocd-tls
            namespace: traefik

    - name: websecure-longhorn
      port: 443
      protocol: HTTPS
      hostname: longhorn.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-longhorn-tls
            namespace: traefik

    - name: websecure-vault
      port: 443
      protocol: HTTPS
      hostname: vault.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-vault-tls
            namespace: traefik

    - name: websecure-keycloak
      port: 443
      protocol: HTTPS
      hostname: keycloak.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-keycloak-tls
            namespace: traefik

    - name: websecure-grafana
      port: 443
      protocol: HTTPS
      hostname: grafana.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-grafana-tls
            namespace: traefik

    - name: websecure-prometheus
      port: 443
      protocol: HTTPS
      hostname: prometheus.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-prometheus-tls
            namespace: traefik

    - name: websecure-alertmanager
      port: 443
      protocol: HTTPS
      hostname: alertmanager.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-alertmanager-tls
            namespace: traefik

    - name: websecure-rag
      port: 443
      protocol: HTTPS
      hostname: rag.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-rag-tls
            namespace: traefik

    - name: websecure-rabbitmq
      port: 443
      protocol: HTTPS
      hostname: rabbitmq.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-rabbitmq-tls
            namespace: traefik

    - name: websecure-oauth2
      port: 443
      protocol: HTTPS
      hostname: oauth2.nss.jkzl.eu
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: nss-oauth2-tls
            namespace: traefik

    # --- Add new subdomain listeners here ---
