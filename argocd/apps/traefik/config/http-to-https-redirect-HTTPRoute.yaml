# HTTP → HTTPS redirect for all hostnames.
# cert-manager's ACME challenge HTTPRoutes use a more specific path match
# (/.well-known/acme-challenge/*) so they take priority over this redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: traefik
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - ass-nss.jkuzel02.online
    - argocd.ass-nss.jkuzel02.online
    - longhorn.ass-nss.jkuzel02.online
    - harbor.ass-nss.jkuzel02.online
    - vault.ass-nss.jkuzel02.online
    - keycloak.ass-nss.jkuzel02.online
    - grafana.ass-nss.jkuzel02.online
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
