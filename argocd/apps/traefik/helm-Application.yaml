# Wave 4 — Traefik ingress controller (depends on cert-manager wave 3 for certificates)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  revisionHistoryLimit: 0
  project: infrastructure
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: ">=33.0.0"
      helm:
        valueFiles:
          - $values/argocd/apps/traefik/helm/values.yaml
    - repoURL: https://github.com/ASS-NSS-Project/infra
      targetRevision: kost
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
