apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rag-rabbitmq
  namespace: rag-system
spec:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    storageClassName: longhorn
    storage: 5Gi
  rabbitmq:
    additionalConfig: |
      log.console.level = info
      consumer_timeout = 3600000
