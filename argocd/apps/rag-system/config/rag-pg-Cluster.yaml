apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rag-pg
  namespace: rag-system
spec:
  instances: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    storageClass: longhorn
    size: 10Gi
  bootstrap:
    initdb:
      database: rag
      owner: rag
