apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-secrets
  namespace: rag-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: rag-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: rag
        property: jwt-secret
    - secretKey: admin-email
      remoteRef:
        key: rag
        property: admin-email
    - secretKey: admin-password
      remoteRef:
        key: rag
        property: admin-password
    - secretKey: s3-access-key
      remoteRef:
        key: rag
        property: s3-access-key
    - secretKey: s3-secret-key
      remoteRef:
        key: rag
        property: s3-secret-key
    - secretKey: s3-endpoint-url
      remoteRef:
        key: rag
        property: s3-endpoint-url
    - secretKey: llm-base-url
      remoteRef:
        key: rag
        property: llm-base-url
    - secretKey: llm-api-key
      remoteRef:
        key: rag
        property: llm-api-key
    - secretKey: llm-model
      remoteRef:
        key: rag
        property: llm-model
    - secretKey: vlm-model
      remoteRef:
        key: rag
        property: vlm-model
    - secretKey: keycloak-client-id
      remoteRef:
        key: oidc/rag-system
        property: client_id
    - secretKey: keycloak-client-secret
      remoteRef:
        key: oidc/rag-system
        property: client_secret
    - secretKey: openai-api-key
      remoteRef:
        key: rag
        property: openai-api-key
    - secretKey: gemini-api-key
      remoteRef:
        key: rag
        property: gemini-api-key
    - secretKey: anthropic-api-key
      remoteRef:
        key: rag
        property: anthropic-api-key
