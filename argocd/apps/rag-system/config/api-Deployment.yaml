apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      containers:
        - name: api
          image: ghcr.io/ass-nss-project/rag-api:kost-bccf233  
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          env:
            - name: HF_HUB_DISABLE_PROGRESS_BARS
              value: "1"
            - name: DEFAULT_SOURCE_URLS
              value: "https://mendelu.cz|html,https://www.ithope.cz/|rendered,https://farmai.eu/|screenshot,https://www.google.com/recaptcha/api2/demo|html"
            # PostgreSQL — from CNPG-managed secret rag-pg-app
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rag-pg-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-pg-app
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: rag-pg-app
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: rag-pg-app
                  key: dbname
            # RabbitMQ — from RabbitMQ Cluster Operator secret
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rag-rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rag-rabbitmq-default-user
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rag-rabbitmq.rag-system.svc:5672/"
            # Qdrant
            - name: QDRANT_URL
              value: "http://qdrant.qdrant.svc.cluster.local:6333"
            # S3 / MinIO
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: s3-endpoint-url
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: s3-secret-key
            - name: S3_REGION
              value: us-east-1
            - name: S3_USE_PATH_STYLE
              value: "false" # true
            - name: S3_BUCKET_EVIDENCE
              value: rag-evidence
            - name: S3_BUCKET_DOCS
              value: rag-documents
            # AIaaS (shared base URL + key for LLM and VLM)
            - name: AIAAS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: llm-base-url
            - name: AIAAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: llm-api-key
            - name: AIAAS_LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: llm-model
            - name: AIAAS_VLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: vlm-model
            # Auth
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: jwt-secret
            - name: FIRST_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: admin-email
            - name: FIRST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: admin-password
            # Keycloak OIDC — URL/realm/redirect are non-secret config
            - name: KEYCLOAK_URL
              value: "https://keycloak.nss.jkzl.eu"
            - name: KEYCLOAK_REALM
              value: "ass-nss-project"
            - name: KEYCLOAK_REDIRECT_URI
              value: "https://rag.nss.jkzl.eu/auth/keycloak/callback"
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: keycloak-client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: keycloak-client-secret
            - name: FRONTEND_URL
              value: "https://rag.nss.jkzl.eu"
            - name: SERVICE_NAME
              value: api
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: rag-api-hf-cache
