# Headless Service required by the rag-worker StatefulSet.
# StatefulSet creates one hf-cache PVC per replica automatically via volumeClaimTemplates
# (hf-cache-rag-worker-0, hf-cache-rag-worker-1, …) — no standalone PVC needed.
apiVersion: v1
kind: Service
metadata:
  name: rag-worker-headless
  namespace: rag-system
spec:
  clusterIP: None
  selector:
    app: rag-worker
