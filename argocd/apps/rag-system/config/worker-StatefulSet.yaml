apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rag-worker
  namespace: rag-system
spec:
  # Scale to 3, 5, 7, 9, … for parallel ingest throughput.
  # Each replica gets its own hf-cache PVC (hf-cache-rag-worker-0, hf-cache-rag-worker-1, …)
  # so the BGE-M3 model is downloaded once per pod and never shared across RWO volumes.
  replicas: 3
  serviceName: rag-worker-headless
  selector:
    matchLabels:
      app: rag-worker
  template:
    metadata:
      labels:
        app: rag-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/ass-nss-project/rag-api:kost-193ec54
          command: ["python", "worker.py"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          env:
            - name: HF_HUB_DISABLE_PROGRESS_BARS
              value: "1"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rag-pg-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-pg-app
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: rag-pg-app
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: rag-pg-app
                  key: dbname
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rag-rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rag-rabbitmq-default-user
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rag-rabbitmq.rag-system.svc:5672/"
            - name: QDRANT_URL
              value: "http://qdrant.qdrant.svc.cluster.local:6333"
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: s3-endpoint-url
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: s3-secret-key
            - name: S3_REGION
              value: us-east-1
            - name: S3_USE_PATH_STYLE
              value: "false"
            - name: S3_BUCKET_EVIDENCE
              value: rag-evidence-prod
            - name: S3_BUCKET_DOCS
              value: rag-documents-prod
            - name: AIAAS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: llm-base-url
            - name: AIAAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: llm-api-key
            - name: AIAAS_LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: llm-model
            - name: AIAAS_VLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: vlm-model
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: jwt-secret
            - name: SERVICE_NAME
              value: worker
  volumeClaimTemplates:
    - metadata:
        name: hf-cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
