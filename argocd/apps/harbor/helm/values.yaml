# Harbor container registry
# TLS is terminated at Traefik — Harbor itself runs plain HTTP internally.

existingSecretAdminPassword: harbor-credentials
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

expose:
  type: clusterIP
  tls:
    enabled: false

# Must match the ingress hostname — Harbor uses this to construct redirect URLs
# and registry push/pull endpoints.
externalURL: https://harbor.ass-nss.jkuzel02.online

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: longhorn
      size: 20Gi
    jobservice:
      jobLog:
        storageClass: longhorn
        size: 1Gi
    database:
      storageClass: longhorn
      size: 2Gi
    redis:
      storageClass: longhorn
      size: 1Gi
    trivy:
      storageClass: longhorn
      size: 5Gi

trivy:
  enabled: true

chartmuseum:
  enabled: false

notary:
  enabled: false
