apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: monitoring
data:
  # Rules are placed under the "fake" tenant — Loki single-tenant (auth_enabled: false) default.
  # Mounted at /var/loki/rules/fake/rules.yaml
  rules.yaml: |
    groups:
      - name: webrag-captcha
        rules:
          - alert: WebRAGCaptchaBlock
            expr: |
              sum(count_over_time({namespace="webrag"} | json | event = `captcha_detected` [5m])) > 0
            for: 0m
            labels:
              severity: warning
              webrag: incident
              namespace: monitoring
            annotations:
              summary: "CAPTCHA block detected in RAG ingest pipeline"
              description: "One or more ingest jobs were blocked by a CAPTCHA in the last 5 minutes. Check the Incidents page."

      - name: webrag-ingest
        rules:
          - alert: WebRAGIngestFailed
            expr: |
              sum(count_over_time({namespace="webrag"} | json | event = `ingest_failed` [5m])) > 0
            for: 0m
            labels:
              severity: warning
              webrag: incident
              namespace: monitoring
            annotations:
              summary: "RAG ingest job failed"
              description: "One or more ingest jobs failed in the last 5 minutes. Check the Jobs page."
