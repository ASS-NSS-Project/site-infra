apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: monitoring
data:
  # Rules are placed under the "fake" tenant — Loki single-tenant (auth_enabled: false) default.
  # Mounted at /var/loki/rules/fake/rules.yaml
  rules.yaml: |
    groups:
      - name: simulate
        rules:
          - alert: SimulatedAlert
            expr: |
              sum(count_over_time({namespace=~".+"} |= "SIMULATE_ALERT" [1m])) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Simulated alert triggered"
              description: "A log line containing SIMULATE_ALERT was detected."

      - name: rag-captcha
        rules:
          - alert: CaptchaIncident
            expr: |
              sum(count_over_time({namespace="rag-system"} | json | event = "captcha_detected" [5m])) > 0
            for: 0m
            labels:
              severity: warning
              rag_app: incident
            annotations:
              summary: "CAPTCHA incident detected in RAG ingest pipeline"
              description: "One or more ingest jobs were blocked by a CAPTCHA in the last 5 minutes. Check the Incidents page."
