# Loki in single-binary mode — all components in one pod, filesystem storage on Longhorn.
# Single-tenant (auth_enabled: false) — no org ID header needed from Alloy.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  rulerConfig:
    alertmanager_url: http://alertmanager-operated.monitoring.svc.cluster.local:9093

singleBinary:
  replicas: 1
  persistence:
    storageClass: longhorn
    size: 20Gi

# Disable distributed-mode components
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# No gateway or memcached needed in single-binary mode
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
