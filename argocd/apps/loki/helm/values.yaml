# Loki in single-binary mode — all components in one pod, filesystem storage on Longhorn.
# Single-tenant (auth_enabled: false) — no org ID header needed from Alloy.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_deletes: true
    retention_period: 30d

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  rulerConfig:
    alertmanager_url: http://alertmanager-operated.monitoring.svc.cluster.local:9093
    enable_api: true
    storage:
      type: local
      local:
        directory: /var/loki/rules
    rule_path: /var/loki/rules-temp
    ring:
      kvstore:
        store: inmemory

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    storageClass: longhorn
    size: 20Gi
  extraVolumes:
    - name: rules
      configMap:
        name: loki-rules
  extraVolumeMounts:
    - name: rules
      mountPath: /var/loki/rules/fake
      readOnly: true

# Disable distributed-mode components
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# No gateway or memcached needed in single-binary mode
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

test:
  enabled: false
lokiCanary:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
