# Wave 15 — Loki log aggregation backend (after Alloy wave 14, before kube-prometheus-stack wave 16)
# No finalizer — Loki owns a Longhorn PVC for log chunks
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  revisionHistoryLimit: 0
  project: observability
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: ">=6.0.0"
      helm:
        releaseName: loki
        valueFiles:
          - $values/argocd/apps/loki/helm/values.yaml
    - repoURL: https://github.com/ASS-NSS-Project/enc-ass-nss-project
      targetRevision: kost
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
