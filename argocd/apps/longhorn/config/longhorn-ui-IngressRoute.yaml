# Exposes the Longhorn UI at https://longhorn.ass-nss.jkuzel02.online
# Uses Traefik IngressRoute (not Gateway API HTTPRoute) so that the
# basicAuth Middleware can be attached natively.
# TLS cert is issued by cert-manager into longhorn-system/ass-nss-longhorn-tls.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.ass-nss.jkuzel02.online`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
      middlewares:
        - name: longhorn-auth
  tls:
    secretName: ass-nss-longhorn-tls
