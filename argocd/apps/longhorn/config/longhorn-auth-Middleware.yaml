apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-forward-auth
  namespace: longhorn-system
spec:
  forwardAuth:
    address: http://oauth2-proxy.traefik.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - Set-Cookie
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-oauth2-errors
  namespace: longhorn-system
spec:
  errors:
    status:
      - "403"
    service:
      name: oauth2-proxy
      namespace: traefik
      port: 4180
    query: /oauth2/sign_in?rd=https://longhorn.nss.jkzl.eu/
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-auth
  namespace: longhorn-system
spec:
  chain:
    middlewares:
      - name: longhorn-forward-auth
      - name: longhorn-oauth2-errors
