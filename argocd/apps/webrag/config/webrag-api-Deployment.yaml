apiVersion: apps/v1
kind: Deployment
metadata:
  name: webrag-api
  namespace: webrag
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webrag-api
  template:
    metadata:
      labels:
        app: webrag-api
    spec:
      containers:
        - name: api
          image: ghcr.io/ass-nss-project/webrag-backend
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          env:
            - name: TZ
              value: Europe/Prague
            - name: HF_HUB_DISABLE_PROGRESS_BARS
              value: "1"
            # PostgreSQL — from CNPG-managed secret rag-pg-app
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: webrag-pg-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webrag-pg-app
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: webrag-pg-app
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: webrag-pg-app
                  key: dbname
            # RabbitMQ — from RabbitMQ Cluster Operator secret
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: webrag-rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: webrag-rabbitmq-default-user
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@webrag-rabbitmq.webrag.svc:5672/"
            # Qdrant
            - name: QDRANT_URL
              value: "http://qdrant.qdrant.svc.cluster.local:6333"
            - name: QDRANT_REPLICATION_FACTOR
              value: "3"
            # S3 / MinIO
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: s3-endpoint-url
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: s3-secret-key
            - name: S3_REGION
              value: us-east-1
            - name: S3_USE_PATH_STYLE
              value: "false" # true
            - name: S3_BUCKET_EVIDENCE
              value: rag-evidence-prod
            - name: S3_BUCKET_DOCS
              value: rag-documents-prod
            - name: S3_BUCKET_EMBEDDINGS
              value: rag-embeddings-prod
            # Embedding settings
            - name: EMBEDDING_TIMEOUT_MINUTES
              value: "5"
            - name: ENABLE_EMBEDDING_BACKUP_S3
              value: "false"
            # Fallback search settings
            - name: ENABLE_KEYWORD_FALLBACK
              value: "true"
            - name: FALLBACK_SEARCH_ENGINE
              value: "postgres_tsvector"
            - name: QDRANT_HEALTH_CHECK_TIMEOUT
              value: "2.0"
            # Healing settings
            - name: HEAL_INTERVAL_MINUTES
              value: "15"
            - name: DRIFT_ALERT_THRESHOLD_PCT
              value: "10.0"
            - name: AUTO_RESYNC_ON_DRIFT
              value: "true"
            # LLM (text generation)
            - name: QUERY_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: query-base-url
            - name: QUERY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: query-api-key
            - name: QUERY_MODEL
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: query-model
            # VLM (vision extraction)
            - name: VLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: vlm-base-url
            - name: VLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: vlm-api-key
            - name: VLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: vlm-model
            # Auth
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: jwt-secret
            - name: FIRST_ADMIN_EMAIL
              value: "admin@example.com"
            - name: FIRST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: admin-password
            # Keycloak OIDC — URL/realm/redirect are non-secret config
            - name: KEYCLOAK_URL
              value: "https://keycloak.nss.jkzl.eu"
            - name: KEYCLOAK_REALM
              value: "ass-nss-project"
            - name: KEYCLOAK_REDIRECT_URI
              value: "https://webrag.nss.jkzl.eu/auth/keycloak/callback"
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: keycloak-client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: keycloak-client-secret
            - name: FRONTEND_URL
              value: "https://webrag.nss.jkzl.eu"
            - name: SERVICE_NAME
              value: api
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: webrag-api
