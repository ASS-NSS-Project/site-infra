apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webrag-system
  namespace: webrag
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-rag
  hostnames:
    - rag.nss.jkzl.eu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /sources
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /query
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /incidents
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /documents
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /experiments
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/auth
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/sources
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/query
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/incidents
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/documents
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/experiments
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: webrag-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: webrag-api
          port: 8000
    - backendRefs:
        - name: webrag-frontend
          port: 80
