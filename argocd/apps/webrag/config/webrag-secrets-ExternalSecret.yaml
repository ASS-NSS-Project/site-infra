apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webrag-secrets
  namespace: webrag
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: webrag-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: rag
        property: jwt-secret
    - secretKey: admin-password
      remoteRef:
        key: rag
        property: admin-password
    - secretKey: s3-access-key
      remoteRef:
        key: rag
        property: s3-access-key
    - secretKey: s3-secret-key
      remoteRef:
        key: rag
        property: s3-secret-key
    - secretKey: s3-endpoint-url
      remoteRef:
        key: rag
        property: s3-endpoint-url
    - secretKey: query-base-url
      remoteRef:
        key: rag
        property: query-base-url
    - secretKey: query-api-key
      remoteRef:
        key: rag
        property: query-api-key
    - secretKey: query-model
      remoteRef:
        key: rag
        property: query-model
    - secretKey: vlm-base-url
      remoteRef:
        key: rag
        property: vlm-base-url
    - secretKey: vlm-api-key
      remoteRef:
        key: rag
        property: vlm-api-key
    - secretKey: vlm-model
      remoteRef:
        key: rag
        property: vlm-model
    - secretKey: keycloak-client-id
      remoteRef:
        key: oidc/webrag
        property: client_id
    - secretKey: keycloak-client-secret
      remoteRef:
        key: oidc/webrag
        property: client_secret
