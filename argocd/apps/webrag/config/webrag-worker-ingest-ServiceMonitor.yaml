apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: webrag-worker-ingest
  namespace: webrag
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: webrag-worker-ingest
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
