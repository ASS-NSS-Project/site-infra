apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: webrag-worker-embed
  namespace: webrag
spec:
  # Scale to 1-3 for parallel embedding throughput.
  # Each replica gets its own hf-cache PVC (ReadWriteOnce).
  replicas: 3
  serviceName: webrag-worker-embed-headless
  selector:
    matchLabels:
      app: webrag-worker-embed
  template:
    metadata:
      labels:
        app: webrag-worker-embed
    spec:
      containers:
        - name: worker-embed
          image: ghcr.io/ass-nss-project/webrag-backend:kost-2750ab3
          command: ["python", "worker_embed.py"]
          ports:
            - name: metrics
              containerPort: 9091
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          env:
            - name: HF_HUB_DISABLE_PROGRESS_BARS
              value: "1"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: webrag-pg-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webrag-pg-app
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: webrag-pg-app
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: webrag-pg-app
                  key: dbname
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: webrag-rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: webrag-rabbitmq-default-user
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@webrag-rabbitmq.webrag.svc:5672/"
            - name: QDRANT_URL
              value: "http://qdrant.qdrant.svc.cluster.local:6333"
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: s3-endpoint-url
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: webrag-secrets
                  key: s3-secret-key
            - name: S3_REGION
              value: us-east-1
            - name: S3_USE_PATH_STYLE
              value: "false"
            - name: S3_BUCKET_DOCS
              value: rag-documents-prod
            - name: S3_BUCKET_EMBEDDINGS
              value: rag-embeddings-prod
            - name: ENABLE_EMBEDDING_BACKUP_S3
              value: "false"
            - name: EMBEDDING_WORKER_METRICS_PORT
              value: "9091"
            - name: SERVICE_NAME
              value: worker_embed
  volumeClaimTemplates:
    - metadata:
        name: hf-cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
