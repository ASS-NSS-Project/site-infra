# kube-prometheus-stack
# Grafana is the only UI exposed externally (via HTTPRoute).
# Prometheus and Alertmanager are cluster-internal.
#
# Prerequisite — create the Grafana admin secret before ArgoCD syncs:
#   Applied by Ansible from k8s/manifests/grafana-credentials-Secret.yaml

grafana:
  admin:
    existingSecret: grafana-credentials
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: false
  service:
    type: ClusterIP
    port: 80
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  envFromSecrets:
    - name: grafana-oidc-secret
  grafana.ini:
    server:
      root_url: https://grafana.ass-nss.jkuzel02.online
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      client_secret: $__env{client_secret}
      scopes: openid profile email
      auth_url: https://keycloak.ass-nss.jkuzel02.online/realms/ass-nss/protocol/openid-connect/auth
      token_url: https://keycloak.ass-nss.jkuzel02.online/realms/ass-nss/protocol/openid-connect/token
      api_url: https://keycloak.ass-nss.jkuzel02.online/realms/ass-nss/protocol/openid-connect/userinfo
      role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'

prometheus:
  prometheusSpec:
    retention: 14d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi

nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
