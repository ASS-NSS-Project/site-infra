alertmanager:
  alertmanagerSpec:
    # Pick up AlertmanagerConfig CRDs from all namespaces
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
  admin:
    existingSecret: grafana-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: sts
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection
  envFromSecrets:
    - name: grafana-oidc-secret
  grafana.ini:
    server:
      root_url: https://grafana.nss.jkzl.eu
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      client_secret: $__env{client_secret}
      scopes: openid profile email
      auth_url: https://keycloak.nss.jkzl.eu/realms/ass-nss-project/protocol/openid-connect/auth
      token_url: https://keycloak.nss.jkzl.eu/realms/ass-nss-project/protocol/openid-connect/token
      api_url: https://keycloak.nss.jkzl.eu/realms/ass-nss-project/protocol/openid-connect/userinfo
      role_attribute_path: contains(groups[*], 'admin') && 'Admin' || contains(groups[*], 'rag_admin') && 'Viewer' || contains(groups[*], 'rag_analyst') && 'Viewer'
      role_attribute_strict: true

kubeScheduler:
  enabled: true
  endpoints:
    - 10.8.0.10
    - 10.8.0.11
    - 10.8.0.12
  service:
    port: 10259
    targetPort: 10259
  serviceMonitor:
    https: true
    insecureSkipVerify: true
    serverName: localhost

kubeControllerManager:
  enabled: true
  endpoints:
    - 10.8.0.10
    - 10.8.0.11
    - 10.8.0.12
  service:
    port: 10257
    targetPort: 10257
  serviceMonitor:
    https: true
    insecureSkipVerify: true
    serverName: localhost

kubeEtcd:
  enabled: true
  endpoints:
    - 10.8.0.10
    - 10.8.0.11
    - 10.8.0.12
  service:
    port: 2381
    targetPort: 2381
  serviceMonitor:
    scheme: http

# RKE2 uses Canal CNI — kube-proxy does not run
kubeProxy:
  enabled: false

nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

prometheus:
  prometheusSpec:
    retention: 14d
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    podMonitorNamespaceSelector: {}
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
