apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-grafana-incident-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "RAG System"
data:
  rag-incidents.json: |
    {
      "title": "WebRAG — Incident Logs",
      "uid": "rag-incidents",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Open Incidents",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "expr": "rag_open_incidents", "datasource": { "type": "prometheus" } }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 }] } } }
        },
        {
          "id": 2, "type": "stat", "title": "CAPTCHA Detections (24h)",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"incident\"} |= `\"captcha_detected\"` [24h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 }] } } }
        },
        {
          "id": 6, "type": "stat", "title": "Incidents Resolved (24h)",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"incident\"} |= `\"incident_resolved\"` [24h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } }
        },
        {
          "id": 3, "type": "stat", "title": "CAPTCHA Detections (1h)",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"incident\"} |= `\"captcha_detected\"` [1h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 3 }] } } }
        },
        {
          "id": 4, "type": "timeseries", "title": "CAPTCHA Detections / hour",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "targets": [{
            "expr": "sum by (strategy) (rate(rag_captcha_incidents_total[5m])) * 3600",
            "legendFormat": "{{strategy}}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 }, "color": { "fixedColor": "orange", "mode": "fixed" } } }
        },
        {
          "id": 5, "type": "logs", "title": "Incident Log (captcha_detected / incident_simulated / incident_resolved)",
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 12 },
          "targets": [{
            "expr": "{namespace=\"rag-system\", rag_app=\"incident\"} | json | event =~ `captcha_detected|incident_simulated|incident_resolved` | line_format \"{{.timestamp}} [{{.level}}] {{.event}} — url={{.url}} strategy={{.strategy}} — {{.message}}\"",
            "datasource": "Loki"
          }],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "dedupStrategy": "none" }
        }
      ]
    }
