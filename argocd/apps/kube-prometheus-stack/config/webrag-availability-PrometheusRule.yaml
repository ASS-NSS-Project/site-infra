apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: webrag-availability-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: webrag.availability
      rules:
        - alert: WebRAGApiDown
          expr: kube_deployment_status_replicas_available{namespace="webrag", deployment="webrag-api"} == 0
          for: 1m
          labels:
            webrag: availability
            severity: critical
          annotations:
            summary: "WebRAG API is down"
            description: "No webrag-api replicas are available. The RAG system is not operational."

        - alert: WebRAGFrontendDown
          expr: kube_deployment_status_replicas_available{namespace="webrag", deployment="webrag-frontend"} == 0
          for: 1m
          labels:
            webrag: availability
            severity: critical
          annotations:
            summary: "WebRAG Frontend is down"
            description: "No webrag-frontend replicas are available. The UI is unreachable."
