apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-system-overview-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  rag-overview.json: |
    {
      "title": "RAG System Overview",
      "uid": "rag-overview",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Indexed Sources",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "expr": "max(rag_active_sources)", "datasource": { "type": "prometheus" } }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } }
        },
        {
          "id": 2, "type": "stat", "title": "Documents (Qdrant vectors)",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "expr": "max(rag_qdrant_collection_size)", "datasource": { "type": "prometheus" } }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } }
        },
        {
          "id": 3, "type": "stat", "title": "CAPTCHA Incidents (open)",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "expr": "max(rag_open_incidents)", "datasource": { "type": "prometheus" } }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 }] } } }
        },
        {
          "id": 4, "type": "stat", "title": "Total Ingest Jobs",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "expr": "sum(rag_ingest_jobs_total) or vector(0)", "datasource": { "type": "prometheus" } }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }] } } }
        },
        {
          "id": 5, "type": "timeseries", "title": "Ingest Activity — 24 Hours",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sum(rate(rag_ingest_jobs_total{status=\"done\"}[30m])) * 1800 or vector(0)", "legendFormat": "done", "datasource": { "type": "prometheus" } },
            { "expr": "sum(rate(rag_ingest_jobs_total{status=\"failed\"}[30m])) * 1800 or vector(0)", "legendFormat": "failed", "datasource": { "type": "prometheus" } },
            { "expr": "sum(rate(rag_ingest_jobs_total{status=\"captcha_blocked\"}[30m])) * 1800 or vector(0)", "legendFormat": "captcha_blocked", "datasource": { "type": "prometheus" } }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "lineWidth": 2, "fillOpacity": 15, "drawStyle": "bars", "barAlignment": -1 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "done" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "failed" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "captcha_blocked" }, "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }] }
            ]
          }
        },
        {
          "id": 6, "type": "bargauge", "title": "Strategy Distribution",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sum by (strategy) (rag_ingest_jobs_total{status=\"done\"}) or vector(0)", "legendFormat": "{{strategy}}", "datasource": { "type": "prometheus" } }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "valueMode": "color"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "api" },        "properties": [{ "id": "color", "value": { "fixedColor": "green",  "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "html" },       "properties": [{ "id": "color", "value": { "fixedColor": "blue",   "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "rendered" },   "properties": [{ "id": "color", "value": { "fixedColor": "yellow", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "screenshot" }, "properties": [{ "id": "color", "value": { "fixedColor": "purple", "mode": "fixed" } }] }
            ]
          }
        }
      ]
    }
