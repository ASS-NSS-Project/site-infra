apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-grafana
  hostnames:
    - grafana.nss.jkzl.eu
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-helm-grafana
          port: 80
