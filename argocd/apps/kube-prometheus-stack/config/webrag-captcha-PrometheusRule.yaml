apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: webrag-captcha-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: webrag.captcha
      rules:
        - alert: WebragCaptchaIncident
          expr: increase(rag_captcha_incidents_total[5m]) > 0
          for: 0m
          labels:
            webrag: incident
            severity: warning
          annotations:
            summary: "CAPTCHA block detected during RAG ingest"
            description: "CAPTCHA incident on strategy {{ $labels.strategy }} — ingest job was blocked."
