apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-grafana-audit-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "RAG System"
data:
  rag-audit.json: |
    {
      "title": "WebRAG — Audit",
      "uid": "rag-audit",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Logins (24h)",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"audit\"} |= `\"login_success\"` [24h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } }
        },
        {
          "id": 2, "type": "stat", "title": "Failed Logins (24h)",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"audit\"} |= `\"login_failed\"` [24h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 }] } } }
        },
        {
          "id": 3, "type": "stat", "title": "Queries (24h)",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"audit\"} |= `\"query_completed\"` [24h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } }
        },
        {
          "id": 4, "type": "stat", "title": "JWT Invalid (24h)",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"audit\"} |= `\"jwt_invalid\"` [24h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 10 }] } } }
        },
        {
          "id": 5, "type": "logs", "title": "Auth & User Events",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "targets": [{
            "expr": "{namespace=\"rag-system\", rag_app=\"audit\"} |= `\"event\"` | json | event =~ `login_success|login_failed|user_registered|user_updated|admin_created|keycloak_unauthorized` | line_format \"{{.timestamp}} [{{.level}}] {{.event}} — {{.message}}\"",
            "datasource": "Loki"
          }],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "dedupStrategy": "none" }
        },
        {
          "id": 8, "type": "logs", "title": "Admin Actions (sources, jobs)",
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 8 },
          "targets": [{
            "expr": "{namespace=\"rag-system\", rag_app=\"audit\"} |= `\"event\"` | json | event =~ `source_created|source_updated|source_deleted|ingest_triggered|job_cancelled|job_deleted` | line_format \"{{.timestamp}} [{{.level}}] {{.event}} — {{.message}}\"",
            "datasource": "Loki"
          }],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "dedupStrategy": "none" }
        },
        {
          "id": 6, "type": "logs", "title": "Query Events",
          "gridPos": { "x": 0, "y": 20, "w": 24, "h": 8 },
          "targets": [{
            "expr": "{namespace=\"rag-system\", rag_app=\"audit\"} |= `\"event\"` | json | event =~ `query_received|query_completed|query_failed` | line_format \"{{.timestamp}} [{{.level}}] {{.event}} — {{.message}}\"",
            "datasource": "Loki"
          }],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "dedupStrategy": "none" }
        },
        {
          "id": 7, "type": "logs", "title": "Security Events",
          "gridPos": { "x": 0, "y": 28, "w": 24, "h": 8 },
          "targets": [{
            "expr": "{namespace=\"rag-system\", rag_app=\"audit\"} |= `\"event\"` | json | event =~ `jwt_invalid|http_error|keycloak_connect_error|presigned_url_failed` | line_format \"{{.timestamp}} [{{.level}}] {{.event}} — {{.message}}\"",
            "datasource": "Loki"
          }],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "dedupStrategy": "none" }
        }
      ]
    }
