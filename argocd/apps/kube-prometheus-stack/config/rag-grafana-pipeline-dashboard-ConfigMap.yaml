apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-grafana-pipeline-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "RAG System"
data:
  rag-pipeline.json: |
    {
      "title": "WebRAG — Pipeline Logs",
      "uid": "rag-pipeline-logs",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Ingest Events (6h)",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"pipeline\"} |= `\"ingest_completed\"` [6h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } }
        },
        {
          "id": 2, "type": "stat", "title": "Ingest Failures (6h)",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"pipeline\"} |= `\"ingest_failed\"` [6h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 }] } } }
        },
        {
          "id": 3, "type": "stat", "title": "Embeddings (6h)",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"pipeline\"} |= `\"embedding_completed\"` [6h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } }
        },
        {
          "id": 4, "type": "stat", "title": "Searches (6h)",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "sum(count_over_time({namespace=\"rag-system\", rag_app=\"pipeline\"} |= `\"search_complete\"` [6h]))",
            "datasource": "Loki"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } }
        },
        {
          "id": 5, "type": "logs", "title": "Ingest Log (ingest_started / ingest_completed / ingest_failed)",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "targets": [{
            "expr": "{namespace=\"rag-system\", rag_app=\"pipeline\"} | json | event =~ `source_seeded|ingest_started|ingest_completed|ingest_failed` | line_format \"{{.timestamp}} [{{.level}}] {{.event}} — strategy={{.strategy}} quality={{.quality_score}} — {{.message}}\"",
            "datasource": "Loki"
          }],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "dedupStrategy": "none" }
        },
        {
          "id": 6, "type": "logs", "title": "Embedding Log (embedding_completed / embedding_failed / chunks_delete)",
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 8 },
          "targets": [{
            "expr": "{namespace=\"rag-system\", rag_app=\"pipeline\"} | json | event =~ `embedding_completed|embedding_failed|chunks_delete|model_load_start|model_load_complete` | line_format \"{{.timestamp}} [{{.level}}] {{.event}} — {{.message}}\"",
            "datasource": "Loki"
          }],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "dedupStrategy": "none" }
        },
        {
          "id": 7, "type": "logs", "title": "Search Log (search_start / search_complete / search_failed)",
          "gridPos": { "x": 0, "y": 20, "w": 24, "h": 8 },
          "targets": [{
            "expr": "{namespace=\"rag-system\", rag_app=\"pipeline\"} | json | event =~ `search_start|search_complete|search_failed` | line_format \"{{.timestamp}} [{{.level}}] {{.event}} — {{.message}}\"",
            "datasource": "Loki"
          }],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "dedupStrategy": "none" }
        }
      ]
    }
