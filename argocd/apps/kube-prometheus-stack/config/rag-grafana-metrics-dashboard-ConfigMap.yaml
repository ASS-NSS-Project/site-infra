apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-grafana-metrics-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  rag-metrics.json: |
    {
      "title": "WebRAG — Metrics",
      "uid": "rag-metrics",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Active Sources",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "rag_active_sources", "datasource": { "type": "prometheus" } }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } }
        },
        {
          "id": 2, "type": "stat", "title": "Qdrant Vectors",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "rag_qdrant_collection_size", "datasource": { "type": "prometheus" } }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } }
        },
        {
          "id": 3, "type": "stat", "title": "Open Incidents",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "rag_open_incidents", "datasource": { "type": "prometheus" } }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 }] } } }
        },
        {
          "id": 4, "type": "stat", "title": "Ingest Job Success Rate (24h)",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "targets": [{
            "expr": "sum(increase(rag_ingest_jobs_total{status=\"done\"}[24h])) / clamp_min(sum(increase(rag_ingest_jobs_total[24h])), 1) * 100",
            "datasource": { "type": "prometheus" }
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "text": {} },
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "orange", "value": 70 }, { "color": "green", "value": 90 }] } } }
        },
        {
          "id": 5, "type": "stat", "title": "Ingest Jobs (24h)",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "targets": [{
            "expr": "sum(increase(rag_ingest_jobs_total[24h]))",
            "datasource": { "type": "prometheus" }
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } }
        },
        {
          "id": 6, "type": "stat", "title": "Queries (24h)",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
          "targets": [{
            "expr": "sum(increase(rag_query_requests_total[24h]))",
            "datasource": { "type": "prometheus" }
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } }
        },
        {
          "id": 7, "type": "timeseries", "title": "Ingest Throughput — Jobs / min (by status)",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sum by (status) (rate(rag_ingest_jobs_total[5m])) * 60", "legendFormat": "{{status}}", "datasource": { "type": "prometheus" } }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqpm", "custom": { "lineWidth": 2, "fillOpacity": 8 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "done" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "failed" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "captcha_blocked" }, "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }] }
            ]
          }
        },
        {
          "id": 8, "type": "timeseries", "title": "Ingest Error Rate (failed + captcha_blocked %)",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(rag_ingest_jobs_total{status=~\"failed|captcha_blocked\"}[5m])) / clamp_min(sum(rate(rag_ingest_jobs_total[5m])), 0.001) * 100",
              "legendFormat": "error rate %",
              "datasource": { "type": "prometheus" }
            },
            {
              "expr": "sum(rate(rag_ingest_jobs_total{status=\"captcha_blocked\"}[5m])) / clamp_min(sum(rate(rag_ingest_jobs_total[5m])), 0.001) * 100",
              "legendFormat": "captcha blocked %",
              "datasource": { "type": "prometheus" }
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percent", "custom": { "lineWidth": 2 }, "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 10 }, { "color": "red", "value": 30 }] }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "error rate %" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "captcha blocked %" }, "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }] }
            ]
          }
        },
        {
          "id": 9, "type": "timeseries", "title": "Ingest Duration — P50 / P90 by Strategy",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le, strategy) (rate(rag_ingest_duration_seconds_bucket[5m])))", "legendFormat": "p50 {{strategy}}", "datasource": { "type": "prometheus" } },
            { "expr": "histogram_quantile(0.90, sum by (le, strategy) (rate(rag_ingest_duration_seconds_bucket[5m])))", "legendFormat": "p90 {{strategy}}", "datasource": { "type": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 10, "type": "timeseries", "title": "CAPTCHA Incidents / hour (by Strategy)",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sum by (strategy) (rate(rag_captcha_incidents_total[5m])) * 3600", "legendFormat": "{{strategy}}", "datasource": { "type": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 }, "color": { "fixedColor": "orange", "mode": "fixed" } } }
        },
        {
          "id": 11, "type": "timeseries", "title": "Query Requests / min (by Mode)",
          "gridPos": { "x": 0, "y": 20, "w": 8, "h": 8 },
          "targets": [
            { "expr": "sum by (mode) (rate(rag_query_requests_total[5m])) * 60", "legendFormat": "{{mode}}", "datasource": { "type": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "reqpm", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 12, "type": "timeseries", "title": "Query Latency — P50 / P90 (by Mode)",
          "gridPos": { "x": 8, "y": 20, "w": 8, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le, mode) (rate(rag_query_latency_seconds_bucket[5m])))", "legendFormat": "p50 {{mode}}", "datasource": { "type": "prometheus" } },
            { "expr": "histogram_quantile(0.90, sum by (le, mode) (rate(rag_query_latency_seconds_bucket[5m])))", "legendFormat": "p90 {{mode}}", "datasource": { "type": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 13, "type": "timeseries", "title": "Embedding Duration — P50 / P90",
          "gridPos": { "x": 16, "y": 20, "w": 8, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.50, rate(rag_embedding_duration_seconds_bucket[5m]))", "legendFormat": "p50", "datasource": { "type": "prometheus" } },
            { "expr": "histogram_quantile(0.90, rate(rag_embedding_duration_seconds_bucket[5m]))", "legendFormat": "p90", "datasource": { "type": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 14, "type": "timeseries", "title": "New Embeddings / min",
          "gridPos": { "x": 0, "y": 28, "w": 12, "h": 8 },
          "targets": [
            { "expr": "rate(rag_chunks_embedded_total[5m]) * 60", "legendFormat": "chunks/min", "datasource": { "type": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 8 }, "color": { "fixedColor": "blue", "mode": "fixed" } } }
        },
        {
          "id": 15, "type": "timeseries", "title": "Ingest Jobs Cumulative (by Status)",
          "gridPos": { "x": 12, "y": 28, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sum by (status) (rag_ingest_jobs_total)", "legendFormat": "{{status}}", "datasource": { "type": "prometheus" } }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "lineWidth": 2 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "done" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "failed" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "captcha_blocked" }, "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }] }
            ]
          }
        }
      ]
    }
