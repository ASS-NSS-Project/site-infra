apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rag-rabbitmq-mgmt
  namespace: rag-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-rabbitmq
  hostnames:
    - rabbitmq.nss.jkzl.eu
  rules:
    - backendRefs:
        - name: rabbitmq
          port: 15672
