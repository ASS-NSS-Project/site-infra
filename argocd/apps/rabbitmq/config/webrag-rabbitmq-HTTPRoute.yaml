apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webrag-rabbitmq
  namespace: webrag
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-rabbitmq
  hostnames:
    - rabbitmq.nss.jkzl.eu
  rules:
    - backendRefs:
        - name: webrag-rabbitmq
          port: 15672
