apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-argocd
  hostnames:
    - argocd.ass-nss.jkuzel02.online
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
