apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  oidc.config: |
    name: Keycloak
    issuer: https://keycloak.ass-nss.jkuzel02.online/realms/ass-nss
    clientID: argocd
    clientSecret: $argocd-oidc-secret:client_secret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
