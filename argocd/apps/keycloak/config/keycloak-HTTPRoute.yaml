apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-keycloak
  hostnames:
    - keycloak.nss.jkzl.eu
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
