apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: webrag
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: RAG system — API, worker, frontend, and backing services
  sourceRepos:
    - https://github.com/ASS-NSS-Project/enc-ass-nss-project
    - https://github.com/ASS-NSS-Project/repo
  destinations:
    - server: https://kubernetes.default.svc
      namespace: webrag
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
