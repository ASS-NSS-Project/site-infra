- name: Setup Docker CE
  import_tasks: Docker-CE.yml

- name: Set flags for Docker Swarm and distribute tokens
  ansible.builtin.include_tasks: Docker-Swarm/set-vars.yml
  when: docker_swarm | default(false)

- name: Initialize Swarm on the first manager
  ansible.builtin.include_tasks: Docker-Swarm/init-leader.yml
  when: 
    - docker_swarm | default(false)
    - is_manager
    - inventory_hostname == groups['swarm_managers'][0]

- name: Ditribute the Join Tokens
  ansible.builtin.include_tasks: Docker-Swarm/distribute-join-tokens.yml
  when: 
    - docker_swarm | default(false)
    - hostvars[groups['swarm_managers'][0]]['manager_token'] is defined
    - hostvars[groups['swarm_managers'][0]]['worker_token'] is defined
    - hostvars[groups['swarm_managers'][0]]['ansible_host'] is defined

- name: Join additional managers
  ansible.builtin.include_tasks: Docker-Swarm/join-managers.yml
  when: 
    - docker_swarm | default(false)
    - is_manager
    - inventory_hostname != groups['swarm_managers'][0]

- name: Join workers
  ansible.builtin.include_tasks: Docker-Swarm/join-workers.yml
  when: 
    - docker_swarm | default(false)
    - is_worker

- name: Promote additional workers to manager role
  ansible.builtin.include_tasks: Docker-Swarm/promote-workers.yml
  when: 
    - docker_swarm | default(false)
  