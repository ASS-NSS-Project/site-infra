- name: Remove legacy bootstrap stack network if it exists
  community.docker.docker_network:
    name: bootstrap_overlay
    state: absent
  when: inventory_hostname == groups['swarm_managers'][0]
  failed_when: false

- name: Install dependencies for Docker Stack module
  become: true
  ansible.builtin.apt:
    name:
      - python3-docker
      - python3-jsondiff
      - python3-yaml
    state: present
    update_cache: true
  when: inventory_hostname == groups['swarm_managers'][0]

- name: Create Bootstrap Directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/bootstrap"
    state: directory
    mode: '0750'
  when: inventory_hostname == groups['swarm_managers'][0]

- name: Copy Bootstrap Compose File to Node
  ansible.builtin.template:
    src: files/docker-compose.yml.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/bootstrap/docker-compose.yml"
  when: inventory_hostname == groups['swarm_managers'][0]

- name: Create directory for Portainer CE data
  become: true  
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: yes
    owner: debian
    group: docker
  loop:
    - "/mnt{{ docker_bootstrap_portainer_ce_data_path }}"
    - "/mnt{{ docker_bootstrap_traefik_letsencrypt_data_path }}"

- name: Deploy Bootstrap Stack (Traefik + Portainer)
  community.docker.docker_stack:
    name: bootstrap
    state: present
    compose:
      - "{{ ansible_facts['env']['HOME'] }}/bootstrap/docker-compose.yml"
  when: inventory_hostname == groups['swarm_managers'][0]
