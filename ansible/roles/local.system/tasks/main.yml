# --- Timezone ---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

# --- NTP ---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true

- name: Configure chrony NTP servers
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

# --- Users ---
- name: Create user accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    create_home: true
    state: present
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set up SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ users | subelements('ssh_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}"

# --- Disk Setup ---
- name: Set up worker Longhorn storage (LVM)
  ansible.builtin.import_tasks: disks-workers.yml
  when: "'workers' in group_names"

- name: Set up control plane extra disk
  ansible.builtin.import_tasks: disks-control-plane.yml
  when: "'control_plane' in group_names"

# --- Sudoers ---
- name: Grant passwordless sudo to sudoer users
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ item.name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ users | selectattr('sudoer', 'defined') | selectattr('sudoer') | list }}"
  loop_control:
    label: "{{ item.name }}"
