- name: Install GlusterFS
  ansible.builtin.apt:
    name: glusterfs-server
    state: present
    update_cache: true

- name: Ensure GlusterFS is started
  ansible.builtin.service:
    name: glusterd
    state: started
    enabled: true

- name: Create brick directory
  ansible.builtin.file:
    path: "{{ glusterfs_brick_path }}"
    state: directory
    mode: '0755'
    
- name: Ensure storage nodes are resolvable
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.name }}"
  loop: "{{ glusterfs_nodes }}"
  