---
- name: Install k3s server (cluster init node)
  ansible.builtin.shell:
    cmd: >
      curl -sfL https://get.k3s.io | sh -s - server
      --cluster-init
      --tls-san {{ k3s_api_lb_vip }}
      --tls-san {{ k3s_api_lb_fip }}
      --disable=traefik
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"

- name: Wait for k3s node token to be generated
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 60

- name: Read node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Expose node token as host fact
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Wait for k3s API to become ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 120

- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../artifacts/kubeconfig"
    flat: true

# Replace 127.0.0.1 with the API LB public FIP so kubectl works from outside
- name: Fix kubeconfig server address
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../artifacts/kubeconfig"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ k3s_api_lb_fip }}:6443"
  delegate_to: localhost
  become: false
