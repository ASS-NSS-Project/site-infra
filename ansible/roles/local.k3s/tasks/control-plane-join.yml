---
# Read the token from CP-0 in case this play runs independently (not after init play)
- name: Read k3s token from init node
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  delegate_to: "{{ groups['cp_primary'][0] }}"
  run_once: true

- name: Set k3s token fact
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Install k3s server (join existing cluster)
  ansible.builtin.shell:
    cmd: >
      curl -sfL https://get.k3s.io | sh -s - server
      --server https://{{ k3s_api_lb_vip }}:6443
      --token {{ k3s_token }}
      --tls-san {{ k3s_api_lb_vip }}
      --tls-san {{ k3s_api_lb_fip }}
      --disable=traefik
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
