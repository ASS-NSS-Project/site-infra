# --- SSH ---
# VMs are ephemeral — disable host key checking to avoid stale known_hosts failures.
ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

# --- Timezone ---
timezone: "Europe/Prague"

# --- NTP ---
ntp_servers:
  - "tik.cesnet.cz"
  - "tak.cesnet.cz"

# --- Users ---
users:
  - name: jkuzel
    sudoer: true
    ssh_keys:
      - "{{ lookup('url', 'https://raw.githubusercontent.com/jkuzel02/pubkey/refs/heads/main/id.pub', validate_certs=false) }}"

  - name: agurina
    sudoer: true
    ssh_key:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH+pXP/GfTQ60sUU4SIZ0WrfiOfVx7oS7jJwm68lFt9E anicka-key

  - name: jkaderka
    sudoer: true
    ssh_key:
      - ssh-rsa  rsa-key-20260306

# --- k3s ---
k3s_version: "v1.32.3+k3s1"

# API LB private VIP — static, defined in terraform/03-ports.tf
# Used by all nodes to join / reach the k3s API server inside the cluster.
k3s_api_lb_vip: "192.168.0.100"

# k3s_api_lb_fip is in group_vars/all/terraform.yml — generated by `terraform apply`
