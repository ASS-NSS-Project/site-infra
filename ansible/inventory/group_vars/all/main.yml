# --- SSH ---
# VMs are ephemeral — disable host key checking to avoid stale known_hosts failures.
ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

# --- Timezone ---
timezone: "Europe/Prague"

# --- NTP ---
ntp_servers:
  - "tik.cesnet.cz"
  - "tak.cesnet.cz"

# --- Users ---
users:
  - name: jkuzel
    sudoer: true
    ssh_keys:
      - "{{ lookup('url', 'https://raw.githubusercontent.com/jkuzel02/pubkey/refs/heads/main/id.pub') }}"

  - name: agurina
    sudoer: true
    ssh_key:
      - "{{ lookup('file', 'files/ssh-keys/agurina.pub') }}"

  - name: jkaderka
    sudoer: true
    ssh_key:
      - "{{ lookup('file', 'files/ssh-keys/jkaderka.pub') }}"

# --- RKE2 ---
rke2_channel: "stable"

# API LB private VIP — static, defined in terraform/03-ports.tf
# Used by all nodes to join / reach the RKE2 API server inside the cluster.
rke2_api_lb_vip: "10.8.0.100"

# rke2_api_lb_fip is in group_vars/all/terraform.yml — generated by `terraform apply`
