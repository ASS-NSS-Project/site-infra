# ArgoCD
# Install:
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm repo update
#   helm install argocd argo/argo-cd \
#     --namespace argocd --create-namespace \
#     --version "^7" \
#     -f k8s/helm/argocd/values.yaml

global:
  domain: argocd.nss.jkzl.eu

configs:
  params:
    # TLS is terminated at the Traefik Gateway — ArgoCD runs insecure internally
    server.insecure: "true"
  cm:
    # Exclude only events — keep Endpoints so kube-prometheus-stack can create
    # static Endpoints for kube-scheduler/controller-manager/etcd scraping
    resource.exclusions: |
      - apiGroups:
        - ""
        kinds:
        - "Event"
        clusters:
        - "*"
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.nss.jkzl.eu/realms/ass-nss-project
      clientID: argocd
      clientSecret: $argocd-oidc-secret:client_secret
      requestedScopes:
        - openid
        - profile
        - email
  rbac:
    policy.csv: |
      g, rag_admin, role:admin
    policy.default: ''

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  ingress:
    enabled: false  # using Gateway API HTTPRoute instead

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
