# Play 1: System setup on all nodes
- name: System setup
  hosts: k3s_cluster
  become: true
  tags: system
  roles:
    - local.system

# Play 2: Bootstrap k3s on CP-0 (cluster-init node)
# Sets k3s_token fact consumed by plays 3 and 4.
- name: Install k3s init control plane
  hosts: cp_primary
  become: true
  tags: k3s
  roles:
    - local.k3s

# Play 3: Join CP-1 and CP-2 to the cluster via API LB VIP
# Runs after CP-0 so the token and etcd quorum are available.
- name: Join k3s follower control planes
  hosts: cp_followers
  become: true
  tags: k3s
  roles:
    - local.k3s

# Play 4: Install k3s agent on workers
- name: Install k3s workers
  hosts: workers
  become: true
  tags: k3s
  roles:
    - local.k3s

# Play 5: Bootstrap ArgoCD on CP-0
# Everything else (Traefik, cert-manager, Longhorn, etc.) is deployed by ArgoCD.
- name: Bootstrap ArgoCD
  hosts: cp_primary
  become: true
  tags: bootstrap
  roles:
    - local.argocd

# Play 6: Deploy all ArgoCD Applications
# Applies every manifest from k8s/apps/ — useful for initial bootstrap
# or forcing re-registration without waiting for App of Apps sync.
- name: Deploy ArgoCD applications
  hosts: cp_primary
  become: true
  tags: bootstrap
  tasks:
    - name: Copy k8s/apps manifests to control plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../k8s/apps/"
        dest: /tmp/argocd-apps/
        mode: "0644"

    - name: Apply all ArgoCD Application manifests
      ansible.builtin.shell:
        cmd: kubectl apply -f /tmp/argocd-apps/
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: apps_apply
      changed_when: "'configured' in apps_apply.stdout or 'created' in apps_apply.stdout"
