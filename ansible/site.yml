# System setup on all nodes
- name: System setup
  hosts: rke2_cluster
  become: true
  tags: system
  roles: ["local.system"]

# Install open-iscsi on all nodes — required by Longhorn for block storage access
- name: Install iSCSI initiator
  hosts: rke2_cluster
  become: true
  tags: iscsi
  roles: ["local.iscsi"]

# Install RKE2 on all cluster nodes.
# The role dispatches init / join / worker logic by group membership.
# cp-0 runs init; join and worker tasks gate on port 9345 being reachable,
# so ordering is enforced inside the role rather than via serial.
- name: Install RKE2
  hosts: rke2_cluster
  become: true
  tags: rke2
  roles: ["local.rke2"]

# Bootstrap ArgoCD from localhost using artifacts/kubeconfig.
# Everything else (Traefik, cert-manager, Longhorn, etc.) is deployed by ArgoCD.
- name: Bootstrap ArgoCD
  hosts: localhost
  connection: local
  tags: argocd
  roles: ["local.argocd"]

# Apply bootstrap resources and kick off ArgoCD Applications.
# Runs locally — secrets must exist before ArgoCD syncs apps that reference them.
- name: Deploy ArgoCD applications
  hosts: localhost
  connection: local
  tags: "argocd,apps"
  tasks:
    - name: Create vault namespace
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ playbook_dir }}/artifacts/kubeconfig"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: vault

    - name: Create Vault KMS SA secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ playbook_dir }}/artifacts/kubeconfig"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: vault-kms-sa
            namespace: vault
          type: Opaque
          stringData:
            credentials.json: "{{ lookup('file', playbook_dir + '/files/vault/kms-sa-key.json') }}"

    - name: Apply root Application
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/../argocd/root-Application.yaml"
        state: present
        kubeconfig: "{{ playbook_dir }}/artifacts/kubeconfig"
