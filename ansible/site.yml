# Play 1: System setup on all nodes
- name: System setup
  hosts: k3s_cluster
  become: true
  tags: system
  roles:
    - local.system

# Play 2: Install k3s server on control plane
- name: Install k3s control plane
  hosts: control_plane
  become: true
  tags: k3s
  roles:
    - local.k3s

# Play 3: Install k3s agent on workers
# Runs after control plane so the token and facts are available via hostvars
- name: Install k3s workers
  hosts: workers
  become: true
  tags: k3s
  roles:
    - local.k3s

# Play 4: Bootstrap ArgoCD + apply root App of Apps
# Everything else (Traefik, cert-manager, Longhorn, etc.) is deployed by ArgoCD
- name: Bootstrap ArgoCD
  hosts: control_plane
  become: true
  tags: bootstrap
  roles:
    - local.argocd

# Play 5: Deploy all ArgoCD Applications
# Applies every manifest from k8s/apps/ directly — useful for initial bootstrap
# or forcing re-registration of all applications without waiting for App of Apps sync.
- name: Deploy ArgoCD applications
  hosts: control_plane
  become: true
  tags: bootstrap
  tasks:
    - name: Copy k8s/apps manifests to control plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../k8s/apps/"
        dest: /tmp/argocd-apps/
        mode: "0644"

    - name: Apply all ArgoCD Application manifests
      ansible.builtin.shell:
        cmd: kubectl apply -f /tmp/argocd-apps/
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: apps_apply
      changed_when: "'configured' in apps_apply.stdout or 'created' in apps_apply.stdout"
