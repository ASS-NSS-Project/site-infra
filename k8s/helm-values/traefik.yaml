# Traefik v3 — Gateway API mode
# Runs as a DaemonSet on all control plane nodes.
# The Octavia LB forwards port 80/443 directly to port 80/443 on each CP node
# via hostPort — no NodePort translation layer.

# Run on control plane nodes only
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

deployment:
  kind: DaemonSet

# Enable Gateway API provider, disable legacy Ingress provider
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true

# Do not create a GatewayClass/Gateway automatically — managed in k8s/traefik/gateway.yaml
gateway:
  enabled: false

gatewayClass:
  enabled: false

# ClusterIP service — traffic arrives via hostPort directly, no NodePort needed.
service:
  type: ClusterIP

ports:
  web:
    port: 80
    hostPort: 80
    expose:
      default: true
  websecure:
    port: 443
    hostPort: 443
    expose:
      default: true

# cert-manager handles all TLS — no need for Traefik's built-in ACME
persistence:
  enabled: false

logs:
  general:
    level: INFO
  access:
    enabled: true
