# Traefik v3 — Gateway API mode
# Runs as a DaemonSet on all control plane nodes.
# The Octavia Ingress LB (192.168.0.101) forwards:
#   port 80  → NodePort 30080 on each CP node
#   port 443 → NodePort 30443 on each CP node

# Run on control plane nodes only
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

deployment:
  kind: DaemonSet

# Enable Gateway API provider, disable legacy Ingress provider
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true

# Do not create a GatewayClass/Gateway automatically — managed in k8s/traefik/gateway.yaml
gateway:
  enabled: false

gatewayClass:
  enabled: false

# NodePort service — Octavia Ingress LB members target these ports on each CP node.
# NodePorts are fixed so the LB member configuration in Terraform stays stable.
service:
  type: NodePort

ports:
  web:
    port: 80
    nodePort: 30080
    expose:
      default: true
  websecure:
    port: 443
    nodePort: 30443
    expose:
      default: true

# cert-manager handles all TLS — no need for Traefik's built-in ACME
persistence:
  enabled: false

logs:
  general:
    level: INFO
  access:
    enabled: true
