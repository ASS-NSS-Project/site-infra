# Keycloak identity provider
# Uses official quay.io/keycloak/keycloak image — NOT Bitnami (requires auth since late 2023).
# TLS is terminated at Traefik — KC_PROXY=edge tells Keycloak to trust X-Forwarded headers.
# Database credentials are auto-generated by CNPG into secret keycloak-postgres-app.
#
# Prerequisite (run once before ArgoCD syncs):
#   kubectl create namespace keycloak
#   kubectl create secret generic keycloak-credentials -n keycloak \
#     --from-literal=admin-password=$(openssl rand -base64 20)

# Use release name as fullname so the Service is simply "keycloak" (matches HTTPRoute)
fullnameOverride: keycloak

# Disable embedded Bitnami PostgreSQL — using CNPG cluster instead
postgresql:
  enabled: false

extraEnv: |
  - name: KC_DB
    value: postgres
  - name: KC_DB_URL
    value: jdbc:postgresql://keycloak-postgres-rw:5432/keycloak
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-postgres-app
        key: username
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-postgres-app
        key: password
  - name: KC_PROXY
    value: edge
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: admin-password
