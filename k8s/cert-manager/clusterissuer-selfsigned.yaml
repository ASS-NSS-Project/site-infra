# Self-signed CA issuer — useful for local testing or when Let's Encrypt
# is unreachable (e.g. port 80 not yet open, staging/dev environments).
# Browsers will show a warning; import the CA cert to trust it locally.
#
# Usage: set issuerRef.name to "selfsigned-ca" in any Certificate resource.

# Step 1 — bootstrap issuer that can sign the CA cert itself
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
# Step 2 — self-signed CA certificate (stored in cert-manager namespace)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selfsigned-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: ass-nss.jkuzel02.online
  secretName: selfsigned-ca-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
# Step 3 — CA-backed issuer used by all other certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-ca
spec:
  ca:
    secretName: selfsigned-ca-tls
