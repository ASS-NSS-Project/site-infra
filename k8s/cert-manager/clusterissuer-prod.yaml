apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jkuzel02@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
                kind: Gateway
---
# Certificate for the root domain.
# cert-manager will perform HTTP-01 challenge via Traefik Gateway
# and store the resulting TLS secret as ass-nss-root-tls in the traefik namespace
# (matching the certificateRef in gateway.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ass-nss-root-tls
  namespace: traefik
spec:
  secretName: ass-nss-root-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - ass-nss.jkuzel02.online
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ass-nss-argocd-tls
  namespace: traefik
spec:
  secretName: ass-nss-argocd-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - argocd.ass-nss.jkuzel02.online
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ass-nss-longhorn-tls
  namespace: traefik
spec:
  secretName: ass-nss-longhorn-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - longhorn.ass-nss.jkuzel02.online
